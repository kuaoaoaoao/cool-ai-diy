server:
  port: 8086

spring:
  application:
    name: coolai-singing
  datasource:
    url: jdbc:postgresql://localhost:5432/coolai
    username: coolai
    password: coolai123
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: coolai
    password: coolai123
  flyway:
    enabled: false

coolai:
  jwt:
    secret: coolai-java-secret-key-must-be-at-least-256-bits-long-for-hs256
  singing:
    rvc:
      enabled: false
      script-path: /opt/rvc/inference.py

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
