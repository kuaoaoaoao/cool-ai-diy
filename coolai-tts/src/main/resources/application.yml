server:
  port: 8084

spring:
  application:
    name: coolai-tts
  datasource:
    url: jdbc:postgresql://localhost:5432/coolai
    username: coolai
    password: coolai123
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: coolai
    password: coolai123
  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

coolai:
  jwt:
    secret: coolai-java-secret-key-must-be-at-least-256-bits-long-for-hs256
  minio:
    enabled: true
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:coolai}
    secret-key: ${MINIO_SECRET_KEY:coolai12345}
    bucket: coolai
  llm:
    openai:
      api-key: ${MIMO_API_KEY:${OPENAI_API_KEY:sk-cd9tm31j1qvw0spb5ja0k3l83b25h7h2ss0kdkqr8znnxm4q}}
      base-url: ${MIMO_BASE_URL:${OPENAI_BASE_URL:https://api.xiaomimimo.com/v1}}
  tts:
    mimo:
      enabled: true
      api-key: ${MIMO_API_KEY:sk-cd9tm31j1qvw0spb5ja0k3l83b25h7h2ss0kdkqr8znnxm4q}
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      model: ${MIMO_TTS_MODEL:mimo-v2.5-tts}
      default-voice: ${MIMO_TTS_VOICE:mimo_default}
      default-instruction: ${MIMO_TTS_INSTRUCTION:用自然、清晰、有亲和力的中文朗读。}
    edge-tts:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
