server:
  port: 8084

spring:
  application:
    name: coolai-tts
  datasource:
    url: jdbc:postgresql://localhost:5432/coolai
    username: coolai
    password: coolai123
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false

coolai:
  jwt:
    secret: coolai-java-secret-key-must-be-at-least-256-bits-long-for-hs256
  tts:
    edge-tts:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
