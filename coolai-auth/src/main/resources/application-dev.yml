server:
  port: 8081

spring:
  application:
    name: coolai-auth
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:coolai}
    username: ${POSTGRES_USER:coolai}
    password: ${POSTGRES_PASSWORD:coolai123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:coolai}
    password: ${RABBITMQ_PASSWORD:coolai123}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isActive
      logic-delete-value: false
      logic-not-delete-value: true

coolai:
  jwt:
    secret: ${JWT_SECRET:coolai-java-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  llm:
    openai:
      api-key: ${MIMO_API_KEY:${OPENAI_API_KEY:sk-cd9tm31j1qvw0spb5ja0k3l83b25h7h2ss0kdkqr8znnxm4q}}
      base-url: ${MIMO_BASE_URL:${OPENAI_BASE_URL:https://api.xiaomimimo.com/v1}}
      models: ${MIMO_CHAT_MODELS:mimo-v2.5-pro}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:fake-anthropic-api-key}
  mcp:
    tavily:
      api-key: ${TAVILY_API_KEY:fake-tavily-api-key}
    openweathermap:
      api-key: ${OPENWEATHERMAP_API_KEY:fake-openweathermap-api-key}
  video:
    wanx:
      api-key: ${WANX_API_KEY:fake-wanx-api-key}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:coolai}
    secret-key: ${MINIO_SECRET_KEY:coolai12345}
    bucket: ${MINIO_BUCKET:coolai}

logging:
  level:
    com.coolai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
